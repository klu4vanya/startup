services:
  nginx:
    restart: unless-stopped
    image: nginx:alpine
    volumes:
      - ./docker/nginx/conf.dev.d:/etc/nginx/conf.d:ro
    ports:
      - 8000:80
    networks:
      - default

  db:
    image: mongo
    restart: always
    volumes:
      - ./docker/db/data:/data/db
      - ./docker/db/db-init/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    env_file:
      - ./database.env
    ports:
      - 27017:27017
    networks:
      - default

  backend:
    build:
      target: runtime_dev
    ports:
      - 5678:5678
    depends_on:
      - db
    networks:
      - default

  start_dependencies:
    build: ./docker/start_dependencies
    depends_on:
      - backend
    command: db:27017 /var/run/python/uwsgi.sock
    volumes:
      - python_sock:/var/run/python
